name: ci

on:
  push:
    branches: [main, master, "agent/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema openai google-adk google-genai python-dotenv
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: CLI help smoke check
        run: python src/main.py --help
      - name: Smoke tests
        run: python -m pytest tests/smoke -q
      - name: Public contract tests
        run: python -m pytest tests/public -q
